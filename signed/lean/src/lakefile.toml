name = "LeanC64"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["C64"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false

# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib at tag v4.35.0-rc3 (commit c55e6e786f49, see lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "C64"

# The checker (core Lean only), compiled to native code so that `native_decide` in the generated
# modules runs compiled code; the kernel-only proofs evaluate the same functions in the kernel.
[[lean_lib]]
name = "C64Core"
precompileModules = true
